apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-alert-rules
  namespace: monitoring
data:
  ecommerce-alerts.yml: |
    groups:
      - name: ecommerce-critical
        rules:
          - alert: HighOrderFailureRate
            expr: |
              rate(order_create_total{status="fail"}[5m])
              /
              clamp_min(sum(rate(order_create_total[5m])), 0.000001)
              > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "下单失败率超过10%"
              description: "过去5分钟下单失败率过高，请检查 Order、Stock 和 MySQL。"

          - alert: OutboxBacklogHigh
            expr: outbox_pending_count > 1000
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Outbox消息积压严重"
              description: "Outbox待投递消息数达到 {{ $value }}，请检查 RabbitMQ 连接和 Worker。"

      - name: ecommerce-warning
        rules:
          - alert: LowMQPublishRate
            expr: |
              sum(rate(mq_publish_total{status="fail"}[5m]))
              /
              clamp_min(sum(rate(mq_publish_total[5m])), 0.000001)
              > 0.05
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "MQ消息投递失败率超过5%"
              description: "请检查 RabbitMQ、Publisher Confirm 和 Outbox 重试状态。"

          - alert: TimeoutOrdersIncreasing
            expr: rate(order_timeout_total[10m]) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "超时订单速率异常升高"
              description: "超时订单速率为 {{ $value }}/s，请检查支付链路和超时补偿。"
