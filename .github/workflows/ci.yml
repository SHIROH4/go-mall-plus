name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ecommerce-demo/go.mod
          cache-dependency-path: ecommerce-demo/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run unit tests
        run: go test -p 1 ./...
      - name: Run static analysis
        run: go vet -p 1 ./...
